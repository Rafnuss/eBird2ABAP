[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eBird2ABAP"
version = "0.5.0"
description = "Research tools for eBird-to-atlas conversion and taxonomy checks"
readme = "README.md"
authors = [
  { name = "Raphaël Nussbaumer" },
]
requires-python = ">=3.11.8"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = ["ruff>=0.11,<1", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4"]
notebooks = ["ipykernel>=6,<8", "nbclient>=0.10,<1"]

[project.urls]
"Homepage" = "https://github.com/Rafnuss/eBird2ABAP"
"Issues" = "https://github.com/Rafnuss/eBird2ABAP/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["eBird2ABAP*"]
namespaces = false

[tool.setuptools.package-data]
eBird2ABAP = ["ebird_avilist_mapping.csv", "avilist_reference.csv", "taxonomy_manifest.json"]

[tool.setuptools.exclude-package-data]
eBird2ABAP = ["matched_species.csv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
